project:
  title: "4-tap Parallel 16-bit Programmable FIR"
  author: "Pengfei Chen"
  discord: ""
  description: "Four parallel 16x16 signed MAC FIR, programmable Q1.15 coefficients"
  language: "Verilog"
  clock_hz: 10000000
  tiles: "1x1"
  top_module: "tt_um_fir4_parallel16"
  source_files:
    - "project.v"
    - "fir_4tap.v"
pinout:
  ui[0]: "data bit 0"
  ui[1]: "data bit 1"
  ui[2]: "data bit 2"
  ui[3]: "data bit 3"
  ui[4]: "data bit 4"
  ui[5]: "data bit 5"
  ui[6]: "data bit 6"
  ui[7]: "data bit 7"
  uo[0]: "read bit 0"
  uo[1]: "read bit 1"
  uo[2]: "read bit 2"
  uo[3]: "read bit 3"
  uo[4]: "read bit 4"
  uo[5]: "read bit 5"
  uo[6]: "read bit 6"
  uo[7]: "read bit 7"
  uio[0]: "opcode bit 0 / out_valid"
  uio[1]: "opcode bit 1"
  uio[2]: "opcode bit 2"
  uio[3]: "output-byte select"
  uio[4]: "unused"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "command strobe"
yaml_version: 6
